[package]
name = "{{crate_name}}"
version = "0.1.0"
description = "{{display_name}} plugin for Contact Hub"
authors = ["{{author}}"]
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ch-plugin-sdk = { git = "https://github.com/C0fuge/66640debf9f91471", version = "1.0" }  # ch:sdk-source
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"

# A plugin is its own crate, never a member of a surrounding workspace.
[workspace]
