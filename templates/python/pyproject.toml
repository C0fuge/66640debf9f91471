[project]
name = "{{module_name}}"
version = "0.1.0"
description = "{{display_name}} plugin for Contact Hub"
authors = [{ name = "{{author}}" }]
requires-python = ">=3.12"
license = "MIT"
dependencies = ["contact-hub-sdk>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
contact-hub-sdk = { git = "https://github.com/C0fuge/66640debf9f91471", subdirectory = "sdk/python" }  # ch:sdk-source

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{module_name}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
