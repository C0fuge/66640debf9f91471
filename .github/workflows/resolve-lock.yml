name: Resolve dependency lock
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source branch or commit
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'C0fuge/66640debf9f91471'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve reviewed manifests without compiling
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          cargo metadata --format-version 1 > "$RUNNER_TEMP/metadata.json"
          git diff -- Cargo.lock > "$RUNNER_TEMP/lock.diff"
          mkdir -p "$RUNNER_TEMP/lock-result"
          cp Cargo.lock "$RUNNER_TEMP/source-commit.txt" "$RUNNER_TEMP/lock.diff" "$RUNNER_TEMP/lock-result/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/lock-result/
          retention-days: 14
