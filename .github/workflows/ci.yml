name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - AGENTS.md
      - .github/cloud-tasks.md
      - LICENSE
      - .gitattributes
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quick:
    if: github.repository == 'C0fuge/66640debf9f91471'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Install uv and Python
        run: bash tools/cloud/setup.sh
      - name: UI and Python suites
        run: |
          mkdir -p "$RUNNER_TEMP/ci-result"
          bash tools/cloud/ci.sh quick 2>&1 | tee "$RUNNER_TEMP/ci-result/quick.log"
      - name: Headless account and message-action UI
        run: |
          mkdir -p "$RUNNER_TEMP/ci-result"
          bash tools/cloud/browser.sh 2>&1 | tee "$RUNNER_TEMP/ci-result/browser.log"
      - name: Write result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-result"
          printf 'UI and Python verification: %s\n' "$RESULT" > "$RUNNER_TEMP/ci-result/quick.txt"
          cat "$RUNNER_TEMP/ci-result/quick.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-quick-${{ github.sha }}
          path: ${{ runner.temp }}/ci-result/
          retention-days: 14
  rust:
    if: github.repository == 'C0fuge/66640debf9f91471'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Cache Cargo dependencies and compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/examples
          key: rust-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-1.99.0-
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config dbus-daemon libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install uv and Python
        run: bash tools/cloud/setup.sh
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
          rustc --version
          cargo --version
      - name: Workspace tests, clippy, fake conformance and binaries
        run: |
          mkdir -p "$RUNNER_TEMP/ci-result"
          bash tools/cloud/ci.sh rust 2>&1 | tee "$RUNNER_TEMP/ci-result/rust.log"
      - name: Write result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-result"
          printf 'Rust and fake conformance verification: %s\n' "$RESULT" > "$RUNNER_TEMP/ci-result/rust.txt"
          cat "$RUNNER_TEMP/ci-result/rust.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-rust-${{ github.sha }}
          path: ${{ runner.temp }}/ci-result/
          retention-days: 14
