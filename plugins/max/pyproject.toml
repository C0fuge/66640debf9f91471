[project]
name = "contact-hub-max-plugin"
version = "0.1.0"
description = "Account-isolated MAX plugin for Contact Hub"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["contact-hub-sdk", "maxapi-python==2.5.0"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30"]

[tool.uv]
package = false

[tool.uv.sources]
contact-hub-sdk = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
