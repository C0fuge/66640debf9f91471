[project]
name = "contact-hub-telegram-plugin"
version = "0.1.0"
description = "Telegram MTProto plugin for Contact Hub"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["contact-hub-sdk", "Telethon==1.46.0", "python-socks[asyncio]>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30"]

[tool.uv]
package = false

[tool.uv.sources]
contact-hub-sdk = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
