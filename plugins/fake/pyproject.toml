[project]
name = "contact-hub-fake-plugin"
version = "0.1.0"
description = "Deterministic fake messenger plugin for Contact Hub UI and e2e tests"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["contact-hub-sdk"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.18", "referencing>=0.30"]

[tool.uv]
package = false

[tool.uv.sources]
contact-hub-sdk = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
